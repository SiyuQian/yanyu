name: "test"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "crates/yanyu-core/**"
      - "scripts/check-yanyu-core-portability.sh"
      - ".github/workflows/test.yml"
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check Rust changes
        id: changes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')"
          if grep -qE '^(src-tauri|crates/yanyu-core)/|^scripts/check-yanyu-core-portability\.sh$|^\.github/workflows/test\.yml$' <<< "$files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: github.event_name != 'pull_request' || steps.changes.outputs.run == 'true'

      - name: Install system dependencies
        if: github.event_name != 'pull_request' || steps.changes.outputs.run == 'true'
        run: |
          sudo apt-get update
          # libvulkan-dev + glslc + spirv-headers let transcribe-cpp-sys build
          # ggml's Vulkan backend (the Linux `vulkan` feature). Mirrors the apt
          # set transcribe.cpp's native-ci uses to build -DTRANSCRIBE_VULKAN=ON.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev libssl-dev libgtk-layer-shell-dev \
            libvulkan-dev glslc spirv-headers

      - uses: swatinem/rust-cache@v2
        if: github.event_name != 'pull_request' || steps.changes.outputs.run == 'true'
        with:
          workspaces: "./src-tauri -> target"

      - name: Run portable Rust core tests
        if: github.event_name != 'pull_request' || steps.changes.outputs.run == 'true'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
        run: cargo test --locked --manifest-path crates/yanyu-core/Cargo.toml --features inference

      - name: Check portable core dependency tree
        if: github.event_name != 'pull_request' || steps.changes.outputs.run == 'true'
        run: bash scripts/check-yanyu-core-portability.sh

      - name: Run Rust tests
        if: github.event_name != 'pull_request' || steps.changes.outputs.run == 'true'
        working-directory: src-tauri
        run: cargo test
