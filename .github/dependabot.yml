version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Pacific/Auckland"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:00"
      timezone: "Pacific/Auckland"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "Pacific/Auckland"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "10:00"
      timezone: "Pacific/Auckland"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(nix)"
