name: Yanyu
options:
  bundleIdPrefix: com.siyuqian
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ArgmaxOpenSourceSDK:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 1.1.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  Yanyu:
    type: application
    platform: iOS
    sources:
      - path: Yanyu
    resources:
      - path: Yanyu/Resources/PrivacyInfo.xcprivacy
    dependencies:
      - sdk: Accelerate.framework
      - sdk: Foundation.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
    preBuildScripts:
      - name: Build portable Rust core
        script: "${SRCROOT}/../scripts/build-ios-core.sh"
        inputFiles:
          - "${SRCROOT}/../scripts/build-ios-core.sh"
          - "${SRCROOT}/../crates/yanyu-core/Cargo.toml"
          - "${SRCROOT}/../crates/yanyu-core/Cargo.lock"
          - "${SRCROOT}/../crates/yanyu-core/src/lib.rs"
          - "${SRCROOT}/../crates/yanyu-core/src/audio.rs"
          - "${SRCROOT}/../crates/yanyu-core/src/gguf_meta.rs"
          - "${SRCROOT}/../crates/yanyu-core/src/hash.rs"
          - "${SRCROOT}/../crates/yanyu-core/src/integrity.rs"
          - "${SRCROOT}/../crates/yanyu-core/src/languages.rs"
          - "${SRCROOT}/../crates/yanyu-core/src/model_capabilities.rs"
          - "${SRCROOT}/../crates/yanyu-core/src/model_catalog.rs"
          - "${SRCROOT}/../crates/yanyu-core/src/model_order.rs"
          - "${SRCROOT}/../crates/yanyu-core/resources/catalog.json"
          - "${SRCROOT}/../crates/yanyu-core/src/model_package.rs"
          - "${SRCROOT}/../crates/yanyu-core/src/inference.rs"
          - "${SRCROOT}/../crates/yanyu-core/src/transcript.rs"
          - "${SRCROOT}/../crates/yanyu-core/src/bin/uniffi-bindgen.rs"
        outputFiles:
          - "${SRCROOT}/build/iphoneos/libyanyu_core.a"
          - "${SRCROOT}/build/iphonesimulator/libyanyu_core.a"
          - "${SRCROOT}/Yanyu/Generated/yanyu_core.swift"
          - "${SRCROOT}/Yanyu/Generated/yanyu_coreFFI.h"
          - "${SRCROOT}/Yanyu/Generated/yanyu_coreFFI.modulemap"
        showEnvVars: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.siyuqian.yanyu.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Yanyu
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Required to hear your voice for transcription."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: "x86_64"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/build/$(PLATFORM_NAME)"
        OTHER_LDFLAGS: "$(inherited) -lyanyu_core -lc++"
        SWIFT_OBJC_BRIDGING_HEADER: Yanyu/Yanyu-Bridging-Header.h

  YanyuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: YanyuTests
    dependencies:
      - target: Yanyu
      - package: ArgmaxOpenSourceSDK
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.siyuqian.yanyu.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Yanyu

  YanyuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: YanyuUITests
    dependencies:
      - target: Yanyu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.siyuqian.yanyu.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Yanyu

schemes:
  Yanyu:
    build:
      targets:
        Yanyu: all
        YanyuTests: [test]
        YanyuUITests: [test]
    test:
      targets:
        - YanyuTests
        - YanyuUITests
