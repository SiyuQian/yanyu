[package]
name = "yanyu-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Portable speech transcription core for Yanyu"

[lib]
name = "yanyu_core"
crate-type = ["staticlib", "rlib"]

[features]
default = []
inference = ["dep:transcribe-cpp"]
bindgen = ["uniffi/cli"]
desktop-specta = ["dep:specta"]

[dependencies]
hound = "3.5.1"
isolang = "2"
natural = "0.5.0"
once_cell = "1"
regex = "1"
rubato = "0.16.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
specta = { version = "=2.0.0-rc.22", features = ["derive"], optional = true }
thiserror = "2"
unicode-normalization = "0.1"
uniffi = "=0.32.2"
whatlang = "0.16"
strsim = "0.11.0"
transcribe-cpp = { version = "0.3.1", default-features = false, features = ["serde"], optional = true }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "ios")'.dependencies]
transcribe-cpp = { version = "0.3.1", default-features = false, features = ["serde", "metal"], optional = true }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]
